<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan...</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0070f3;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p id="status">Mengarahkan ke halaman tujuan...</p>
  </div>

  <script>
    async function redirect() {
      const urlParams = new URLSearchParams(window.location.search);
      let id = urlParams.get('id');

      if (!id) {
        document.getElementById('status').innerText = "Error: Parameter ID tidak ditemukan.";
        return;
      }

      id = id.trim();

      try {
        // Memaksa browser selalu ambil data redirects.json terbaru (anti-cache)
        const response = await fetch('./redirects.json?v=' + Date.now(), { cache: 'no-store' });
        const data = await response.json();

        if (data && data[id]) {
          window.location.replace(data[id]);
        } else {
          document.getElementById('status').innerText = "Error: Link untuk ID " + id + " belum terdaftar.";
        }
      } catch (err) {
        document.getElementById('status').innerText = "Error mengambil data pengalihan.";
      }
    }

    redirect();
  </script>
</body>
</html>
